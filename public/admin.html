<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-panel</title>
    <link rel="stylesheet" href="css/output.css">
</head>

<body>

    <!-- navbar -->
    <nav class="bg-gray-900 text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a class="flex items-center space-x-2" href="index.html">
                    <span class="text-2xl">🎵</span>
                    <span class="font-bold text-xl">BeatStore</span>
                </a>
                <div class="flex items-center space-x-6">
                    <a class="flex items-center gap-1 hover:text-blue-400 transition-colors" href="./index.html">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-music-note" viewBox="0 0 16 16">
                            <path d="M9 13c0 1.105-1.12 2-2.5 2S4 14.105 4 13s1.12-2 2.5-2 2.5.895 2.5 2" />
                            <path fill-rule="evenodd" d="M9 3v10H8V3z" />
                            <path d="M8 2.82a1 1 0 0 1 .804-.98l3-.6A1 1 0 0 1 13 2.22V4L8 5z" />
                        </svg>
                        <span>Beats</span>
                    </a>
                    <a class="flex items-center space-x-2 hover:text-blue-400 transition-colors" href="./cart.html">
                        <span class="relative">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-shopping-cart w-5 h-5">
                                <circle cx="8" cy="21" r="1"></circle>
                                <circle cx="19" cy="21" r="1"></circle>
                                <path
                                    d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12">
                                </path>
                            </svg>
                            <span id="cart-badge"
                                class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center"></span>
                        </span>
                        <span>Winkelwagen</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>


    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div>
            <h1 class="text-4xl font-bold text-gray-900 mb-8">Admin Panel</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">Total Revenue</p>
                            <p id="total-revenue" class="text-3xl font-bold text-green-600">$0.00</p>
                        </div><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" class="lucide lucide-dollar-sign w-12 h-12 text-green-600">
                            <line x1="12" x2="12" y1="2" y2="22"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">Total Orders</p>
                            <p id="total-orders" class="text-3xl font-bold text-blue-600">0</p>
                        </div><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" class="lucide lucide-package w-12 h-12 text-blue-600">
                            <path
                                d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z">
                            </path>
                            <path d="M12 22V12"></path>
                            <polyline points="3.29 7 12 12 20.71 7"></polyline>
                            <path d="m7.5 4.27 9 5.15"></path>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-900">Beheer Beats</h2>
                    <div class="flex space-x-2">
                        <button id="btn-reset"
                            class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-rotate-ccw w-5 h-5">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                            <span>Reset naar Origineel</span>
                        </button>
                        <button id="btn-add-beat"
                            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-plus w-5 h-5">
                                <path d="M5 12h14"></path>
                                <path d="M12 5v14"></path>
                            </svg>
                            <span>Nieuwe Beat Toevoegen</span>
                        </button>
                    </div>
                </div>
                <!-- Nieuwe Beat formulier (verborgen) -->
                <div id="add-beat-form" class="hidden bg-white rounded-lg shadow-md p-6 mb-4">
                    <h3 id="form-title" class="text-lg font-semibold text-gray-800 mb-4">Nieuwe Beat Toevoegen</h3>
                    <form id="form-new-beat" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="hidden" id="beat-edit-id">
                        <div>
                            <label for="beat-title" class="block text-sm font-medium text-gray-700 mb-1">Titel</label>
                            <input type="text" id="beat-title" required
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="Beat titel">
                        </div>
                        <div>
                            <label for="beat-producer" class="block text-sm font-medium text-gray-700 mb-1">Producer</label>
                            <input type="text" id="beat-producer" required
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="Producer naam">
                        </div>
                        <div>
                            <label for="beat-bpm" class="block text-sm font-medium text-gray-700 mb-1">BPM</label>
                            <input type="number" id="beat-bpm" required min="40" max="300"
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="120">
                        </div>
                        <div>
                            <label for="beat-genre" class="block text-sm font-medium text-gray-700 mb-1">Genre</label>
                            <input type="text" id="beat-genre" required
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="Trap, Hip Hop, EDM...">
                        </div>
                        <div class="md:col-span-2">
                            <label for="beat-image" class="block text-sm font-medium text-gray-700 mb-1">Afbeelding URL</label>
                            <input type="url" id="beat-image"
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="https://...">
                        </div>
                        <div>
                            <label for="beat-price-basic" class="block text-sm font-medium text-gray-700 mb-1">Basic prijs (MP3) $</label>
                            <input type="number" id="beat-price-basic" required min="0" step="0.01"
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="29.99">
                        </div>
                        <div>
                            <label for="beat-price-premium" class="block text-sm font-medium text-gray-700 mb-1">Premium prijs (WAV) $</label>
                            <input type="number" id="beat-price-premium" required min="0" step="0.01"
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="49.99">
                        </div>
                        <div>
                            <label for="beat-price-exclusive" class="block text-sm font-medium text-gray-700 mb-1">Exclusive prijs (WAV + Stems)
                                $</label>
                            <input type="number" id="beat-price-exclusive" required min="0" step="0.01"
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                                placeholder="149.99">
                        </div>
                        <div class="md:col-span-2 flex space-x-3 pt-2 gap-6">
                            <button type="submit"
                                class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg transition-colors">
                                Beat Toevoegen
                            </button>
                            <button type="button" id="btn-cancel-add"
                                class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-lg transition-colors">
                                Annuleren
                            </button>
                        </div>
                    </form>
                </div>

                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Beat</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Genre</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    BPM</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Price</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="beats-tbody" class="bg-white divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-900 mb-4">Recente Bestellingen</h2>
                <div id="orders-container" class="space-y-4">
                    <div class="bg-white rounded-lg shadow-md p-8 text-center">
                        <p class="text-gray-500">Nog geen bestellingen</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="./js/storage.js" defer></script>
    <script src="./js/admin.js" defer></script>
</body>

</html>
